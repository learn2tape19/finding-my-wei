schema_version: "1.0"

destinations:
  - destination_id: tao.wordpress.production
    domain: tao_of_clinical_touch
    platform: wordpress
    enabled: true
    adapter: wordpress_v1
    account_ref: "tao_site_123"
    auth:
      method: "application_password"
      secret_refs:
        - "WORDPRESS_TAO_CREDENTIAL_REF"
    permissions:
      - media_upload
      - post_create
      - post_schedule
      - post_publish
    verification: wordpress_post_readback

  - destination_id: tao.brevo.production
    domain: tao_of_clinical_touch
    platform: brevo
    enabled: true
    adapter: brevo_v1
    account_ref: "tao_account_456"
    auth:
      method: "api_key"
      secret_refs:
        - "BREVO_TAO_API_KEY_REF"
    permissions:
      - campaign_create
      - campaign_schedule
    verification: brevo_campaign_readback

  - destination_id: test.disabled.destination
    domain: test_domain
    platform: test_platform
    enabled: false
    adapter: test_adapter
    account_ref: "test_account_789"
    auth:
      method: "oauth"
      secret_refs:
        - "TEST_PLATFORM_TOKEN"
    permissions:
      - test_publish
    verification: test_readback
